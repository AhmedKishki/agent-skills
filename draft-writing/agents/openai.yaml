interface:
  display_name: draft writing
  short_description: Collaboratively assemble a user-controlled, source-grounded article
    through a lean five-stage workflow. Use for thesis-led drafting, a requested full-export
    handoff ZIP, or a verbatim combination of complete source maps and index. The user controls
    synthesis and article decisions, source fidelity preserves meaning without defaulting
    to quotation, and every canonical content passage retains Human/Mixed/AI provenance.
    Supports independent letter-coded source maps with theory/metatheory roles, automatic
    excerpt indexing, white box gap-gated synthesis, lean current-state files with
    disclosed removals, global/local arcs, previous-major migration, and tracker-led handoffs.
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
