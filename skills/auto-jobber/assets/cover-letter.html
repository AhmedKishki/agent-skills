<!doctype html>
<!-- Credits and license: see THIRD_PARTY_LICENSE. -->
<html lang="$language">
<head>
  <meta charset="utf-8">
  <title>$title</title>
</head>
<body>
<main id="document">
  <header class="about-me">
    <h1 class="about-me__name">$name</h1>
    <p class="about-me__address">$location</p>
    <p class="about-me__social">$contact</p>
  </header>
  <div class="letter__meta"><p>$date</p><p>$company</p></div>
  <p class="letter__subject">$role</p>
  <div class="letter__body"><p>$greeting</p>$paragraphs</div>
  <div class="letter__closing"><p>$closing</p><p>$name</p></div>
</main>
</body>
</html>
