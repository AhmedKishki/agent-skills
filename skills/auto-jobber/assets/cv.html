<!doctype html>
<!-- Layout adapted from jgibson02/awesome-cv-html; see THIRD_PARTY_LICENSE. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Curriculum vitae</title>
  <link rel="stylesheet" href="cv.css">
</head>
<body>
<main id="document">
  <header class="about-me">
    <h1 class="about-me__name"></h1>
    <p class="about-me__position"></p>
    <p class="about-me__address"></p>
    <p class="about-me__social"></p>
  </header>
  <section class="summary">
    <h2 class="section__heading">Profile<span class="section__heading-underline"></span></h2>
    <p></p>
  </section>
  <section class="experience">
    <h2 class="section__heading">Experience<span class="section__heading-underline"></span></h2>
  </section>
  <section class="skills">
    <h2 class="section__heading">Skills<span class="section__heading-underline"></span></h2>
  </section>
  <section class="education">
    <h2 class="section__heading">Education<span class="section__heading-underline"></span></h2>
  </section>
  <section class="projects">
    <h2 class="section__heading">Projects<span class="section__heading-underline"></span></h2>
  </section>
</main>
</body>
</html>
